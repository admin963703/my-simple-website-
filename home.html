<!DOCTYPE html>
<html lang="en">
<head>
<title>Complete Dashboard System</title>

<style>
:root{
    --sidebar-width:160px;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
    transition:0.3s;
}

body{
    display:flex;
    background:#f4f6f9;
}

/* DARK MODE */
body.dark{
    background:#121212;
    color:white;
}

/* SIDEBAR */
.sidebar{
    width:var(--sidebar-width);
    height:100vh;
    position:fixed;
    left:0;
    top:0;
    background:linear-gradient(180deg,#0072ff,#00c6ff);
    color:white;
    padding:15px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
}

.sidebar h2{
    text-align:center;
    margin-bottom:20px;
}

.sidebar a{
    display:block;
    padding:10px;
    color:white;
    text-decoration:none;
    border-radius:6px;
}

.sidebar a:hover{
    background:rgba(255,255,255,0.2);
}

/* LOGOUT BUTTON */
.logout a{
    text-decoration:none;
    background:#ff4d4d;
    color:white;
    padding:10px;
    border-radius:25px;
    text-align:center;
    display:block;
    transition:0.3s;
}

.logout a:hover{
    background:#cc0000;
    transform:scale(1.05);
}

/* MAIN */
.main{
    margin-left:var(--sidebar-width);
    width:100%;
    padding:20px;
}

/* TOPBAR */
.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:white;
    padding:10px;
    border-radius:10px;
}

/* 🔥 SEARCH BOX WIDTH INCREASED */
.topbar input{
    width:450px;   /* 👈 increased width */
    padding:10px;
    border-radius:8px;
    border:1px solid #ccc;
}

body.dark .topbar{
    background:#1e1e1e;
}

/* PROFILE */
.profile{
    display:flex;
    align-items:center;
    gap:10px;
}

.profile img{
    width:40px;
    height:40px;
    border-radius:50%;
}

/* CARDS */
.cards{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
    margin-top:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    text-align:center;
}

body.dark .card{
    background:#1e1e1e;
}

button{
    padding:10px;
    margin-top:10px;
    width:100%;
    background:#0072ff;
    color:white;
    border:none;
    cursor:pointer;
    border-radius:8px;
}

button:hover{
    background:#0055cc;
}

</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

<div>
    <h2>MENU</h2>

    <a href="home.html">🏠 Home</a>
    <a href="profile.html">👤 Profile</a>
    <a href="settings.html">⚙ Settings</a>
    <a href="notification.html">🔔Notifications</a>
    <a href="help.html">❓ Help</a>
</div>

<div class="logout">
    <a href="login.html" onclick="logout(event)">🚪 Logout</a>
</div>

</div>

<!-- MAIN -->
<div class="main">

    <!-- TOPBAR -->
    <div class="topbar">

        <input type="text" placeholder="Search here...">
        
        <div class="profile">
            <span id="user">User</span>
            <img id="img" src="https://via.placeholder.com/40">
        </div>

    </div>

    <!-- DASHBOARD -->
    <div class="cards">
        <div class="card">
            <img src="industry.png" alt="User Profile Image" width="200">
            <h3>business</h3>
            <p>Manage your business</p>
            <button onclick="openPage('search.html')">Open</button>
        </div>

        <div class="card">
            <img src="library.png" alt="User Profile Image" width="200">
            <h3>library</h3>
            <p>Explore resources</p>
            <button onclick="openPage('library.html')">Open</button>
        </div>

        <div class="card">
            <img src="automobiles.png" alt="User Profile Image" width="200">
            <h3>Automobiles</h3>
            <p>System control</p>
            <button onclick="openPage('automobiles.html')">Open</button>
        </div>

        <div class="card">
            <h3>Notifications</h3>
            <p>Updates</p>
            <button onclick="openPage('notification.html')">Open</button>
        </div>

    </div>

</div>

<script>

window.onload = function () {
    let name = localStorage.getItem("username");
    let imgData = localStorage.getItem("profilePic");

    if (name) document.getElementById("user").innerText = name;
    if (imgData) document.getElementById("img").src = imgData;
};

function openPage(page){
    window.location.href = page;
}

function logout(event){
    event.preventDefault();
    localStorage.clear();
    window.location.href = "login.html";
}

</script>

</body>
</html>
