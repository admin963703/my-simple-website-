<!DOCTYPE html>
<html lang="en">
<head>
<title>Advanced Dashboard</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    display:flex;
    background:#f4f6f9;
}

/* SIDEBAR */
.sidebar{
    width:250px;
    height:100vh;
    background:linear-gradient(180deg,#0072ff,#00c6ff);
    position:fixed;
    padding-top:20px;
}

.sidebar h2{
    text-align:center;
    color:white;
    margin-bottom:20px;
}

.sidebar a{
    display:block;
    padding:15px;
    color:white;
    text-decoration:none;
}

.sidebar a:hover{
    background:rgba(255,255,255,0.2);
    padding-left:25px;
}

/* MAIN */
.main{
    margin-left:250px;
    width:calc(100% - 250px);
    padding:20px;
}

/* TOPBAR */
.topbar{
    display:flex;
    justify-content:space-between;
    background:white;
    padding:15px;
    border-radius:10px;
    box-shadow:0 3px 10px rgba(0,0,0,0.2);
}

/* PROFILE */
.profile{
    display:flex;
    align-items:center;
    gap:10px;
}

.profile img{
    width:40px;
    height:40px;
    border-radius:50%;
}

/* CARDS */
.cards{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
    margin-top:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:15px;
    text-align:center;
    transition:0.3s;
}

.card:hover{
    transform:translateY(-10px);
}

/* CHART */
.chart-box{
    margin-top:20px;
    background:white;
    padding:20px;
    border-radius:15px;
}

.bar{
    height:20px;
    background:#0072ff;
    margin:10px 0;
    border-radius:5px;
    width:0;
    transition:1s;
}

/* BACK BUTTON */
.back-btn{
    position:fixed;
    bottom:20px;
    right:20px;
    padding:12px 18px;
    border:none;
    border-radius:50px;
    background:#0072ff;
    color:white;
    cursor:pointer;
    overflow:hidden;
    transition:0.3s;
}

.back-btn:hover{
    transform:scale(1.1);
    background:#0055cc;
}

/* RIPPLE */
.ripple{
    position:absolute;
    background:rgba(255,255,255,0.6);
    border-radius:50%;
    transform:scale(0);
    animation:ripple 0.6s linear;
}

@keyframes ripple{
    to{
        transform:scale(4);
        opacity:0;
    }
}

</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <h2>Dashboard</h2>
    <a href="home.html">🏠 Home</a>
    <a href="profile.html">👤 Profile</a>
    <a href="#">📊 Dashboard</a>
    <a href="login.html">🚪 Logout</a>
</div>

<!-- MAIN -->
<div class="main">

    <!-- TOPBAR -->
    <div class="topbar">
        <h3 id="welcome">Welcome User</h3>

        <div class="profile">
            <img id="img" src="https://via.placeholder.com/40">
        </div>
    </div>

    <!-- CARDS -->
    <div class="cards">
        <div class="card">
            <h2 id="users">0</h2>
            <p>Users</p>
        </div>

        <div class="card">
            <h2 id="projects">0</h2>
            <p>Projects</p>
        </div>

        <div class="card">
            <h2 id="messages">0</h2>
            <p>Messages</p>
        </div>
    </div>

    <!-- CHART -->
    <div class="chart-box">
        <h3>Performance Chart</h3>
        <div class="bar" id="b1"></div>
        <div class="bar" id="b2"></div>
        <div class="bar" id="b3"></div>
    </div>

</div>

<!-- BACK BUTTON -->
<button class="back-btn" onclick="goBack(event)">Back</button>

<script>

/* LOAD PROFILE */
window.onload=function(){
    let name = localStorage.getItem("username");
    let imgData = localStorage.getItem("profilePic");

    if(name){
        document.getElementById("welcome").innerText = "Welcome " + name;
    }

    if(imgData){
        document.getElementById("img").src = imgData;
    }
};

/* COUNTERS */
function animate(id,end){
    let el=document.getElementById(id);
    let count=0;

    let interval=setInterval(()=>{
        count++;
        el.innerText=count;
        if(count==end) clearInterval(interval);
    },20);
}

animate("users",120);
animate("projects",35);
animate("messages",10);

/* CHART */
setTimeout(()=>{
    document.getElementById("b1").style.width="80%";
    document.getElementById("b2").style.width="60%";
    document.getElementById("b3").style.width="90%";
},500);

/* BACK BUTTON */
function goBack(e){
    window.history.back();

    const btn=e.currentTarget;
    const circle=document.createElement("span");

    let size=Math.max(btn.clientWidth,btn.clientHeight);
    circle.style.width=circle.style.height=size+"px";
    circle.classList.add("ripple");

    btn.appendChild(circle);

    setTimeout(()=>circle.remove(),600);
}

</script>

</body>
</html>
